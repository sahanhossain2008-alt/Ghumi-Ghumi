
name: Build Ghumi Ghumi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o "ghumi-ghumi (1).zip" -d extracted
          echo "ZIP extracted"

      - name: Find Android project
        run: |
          find . -name gradlew -type f
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          chmod +x extracted/gradlew
          cd extracted
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghumi-Ghumi-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
